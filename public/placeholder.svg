<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750">
  <rect fill="#f3f4f6" width="500" height="750"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#grad1)" width="500" height="750"/>
  <g fill="#9ca3af" opacity="0.7">
    <!-- Camera icon -->
    <circle cx="250" cy="300" r="80" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="250" cy="300" r="50" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="250" cy="300" r="20" fill="#9ca3af"/>
    <!-- Film strips -->
    <rect x="80" y="450" width="340" height="200" fill="none" stroke="#9ca3af" stroke-width="2" rx="4"/>
    <text x="250" y="560" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#9ca3af">
      NO IMAGE
    </text>
  </g>
</svg>
